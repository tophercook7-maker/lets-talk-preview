<style>
  :root{
    --cream:#F8F5ED; --cream-2:#F2EBDD; --paper:#FFFDF8;
    --ink:#17150F; --ink-2:#5B554A; --ink-3:#8B8477;
    --amber:#F5A623; --amber-d:#C97C0C; --amber-t:#FDF0D8; --glow:#FFD79238;
    --rule:#E7DDC9; --live:#2FA36B;
    --sh1:0 2px 8px rgba(23,21,15,.05);
    --sh2:0 18px 44px -22px rgba(23,21,15,.34);
    --sh3:0 40px 80px -34px rgba(23,21,15,.46);
    --ease:cubic-bezier(.2,.8,.28,1);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --cream:#121009; --cream-2:#191710; --paper:#1F1B12;
    --ink:#F7F2E5; --ink-2:#B2AB98; --ink-3:#87806F;
    --amber:#FBB33F; --amber-d:#FFC96E; --amber-t:#2C2110; --glow:#FFC46E20;
    --rule:#302B1E; --live:#4FCB90;
    --sh2:0 18px 44px -22px rgba(0,0,0,.78); --sh3:0 40px 80px -34px rgba(0,0,0,.85);
  }}
  :root[data-theme="dark"]{
    --cream:#121009; --cream-2:#191710; --paper:#1F1B12;
    --ink:#F7F2E5; --ink-2:#B2AB98; --ink-3:#87806F;
    --amber:#FBB33F; --amber-d:#FFC96E; --amber-t:#2C2110; --glow:#FFC46E20;
    --rule:#302B1E; --live:#4FCB90;
    --sh2:0 18px 44px -22px rgba(0,0,0,.78); --sh3:0 40px 80px -34px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--cream);color:var(--ink);overflow-x:hidden;
    font-family:Karla,system-ui,sans-serif;font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased}
  /* warm grain for depth */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.42;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.32'/></svg>");
    mix-blend-mode:multiply}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::after{mix-blend-mode:screen;opacity:.2}}
  .w{width:min(1140px,90vw);margin:0 auto}
  .nar{width:min(730px,90vw);margin:0 auto}
  img{max-width:100%;display:block}
  a{color:inherit}
  h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;
    line-height:1.02;letter-spacing:-.032em;margin:0;text-wrap:balance}
  .amb{color:var(--amber-d)}

  .logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;flex:none}
  .bub{width:36px;height:30px;background:var(--amber);border-radius:10px;position:relative;
    display:grid;place-items:center;flex:none}
  .bub::after{content:"";position:absolute;bottom:-7px;left:8px;
    border-left:9px solid var(--amber);border-bottom:10px solid transparent}
  .bub i{width:5px;height:5px;border-radius:50%;background:#fff;display:block;
    box-shadow:9px 0 0 #fff,-9px 0 0 #fff;animation:tdot 1.6s ease-in-out infinite}
  .logo b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:16.5px;
    line-height:.95;text-transform:uppercase;letter-spacing:-.02em}
  @keyframes tdot{0%,60%,100%{opacity:1}30%{opacity:.3}}

  header{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);
    background:color-mix(in srgb,var(--cream) 86%,transparent);border-bottom:1px solid var(--rule)}
  .bar{display:flex;align-items:center;gap:14px;padding:12px 0;justify-content:space-between}
  .status{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;
    color:var(--ink-2);background:var(--paper);border:1px solid var(--rule);padding:7px 14px;border-radius:999px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none;animation:pulse 2.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,163,107,.55)}70%{box-shadow:0 0 0 10px rgba(47,163,107,0)}100%{box-shadow:0 0 0 0 rgba(47,163,107,0)}}
  .btn{display:inline-block;background:var(--amber);color:#20160A;text-decoration:none;
    font-family:Karla,sans-serif;font-weight:700;font-size:15.5px;padding:12px 24px;border-radius:999px;
    border:none;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .2s}
  .btn:hover{background:var(--amber-d);transform:translateY(-3px);box-shadow:0 14px 26px -12px rgba(201,124,12,.75)}
  .btn.lg{font-size:17.5px;padding:16px 34px}
  .btn.dark{background:var(--ink);color:var(--cream)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}
  .btn.ghost:hover{background:var(--paper);box-shadow:none}
  @media(max-width:700px){.status{display:none}}

  /* ── HERO with live chat demo ─────────────────── */
  .hero{position:relative;padding:clamp(36px,5vw,60px) 0 clamp(50px,7vw,80px);overflow:hidden}
  .hero::before{content:"";position:absolute;top:-34%;left:50%;transform:translateX(-50%);
    width:1300px;height:1000px;background:radial-gradient(circle,var(--glow) 0%,transparent 62%);pointer-events:none}
  .hero-in{position:relative;display:grid;gap:clamp(32px,4.5vw,56px);align-items:center}
  @media(min-width:960px){.hero-in{grid-template-columns:1fr 1fr}}
  .eyeb{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;
    letter-spacing:.15em;text-transform:uppercase;color:var(--amber-d);margin-bottom:20px}
  .eyeb::before{content:"";width:26px;height:2px;background:var(--amber)}
  h1{font-size:clamp(38px,6.3vw,72px)}
  .lede{font-size:clamp(17.5px,2.1vw,21px);color:var(--ink-2);max-width:44ch;margin:24px 0 0}
  .hcta{display:flex;flex-wrap:wrap;gap:13px;align-items:center;margin-top:32px}
  .hnote{font-size:14.5px;color:var(--ink-3);margin-top:14px}

  /* chat panel */
  .chat{background:var(--paper);border:1px solid var(--rule);border-radius:26px;
    box-shadow:var(--sh3);overflow:hidden;position:relative}
  .chat-top{display:flex;align-items:center;gap:11px;padding:15px 20px;border-bottom:1px solid var(--rule);
    background:color-mix(in srgb,var(--amber-t) 60%,var(--paper))}
  .ava{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;box-shadow:var(--sh1)}
  .ava img{width:100%;height:100%;object-fit:cover;object-position:60% 30%}
  .chat-top b{font-family:"Bricolage Grotesque",sans-serif;font-size:15.5px;display:block;line-height:1.2}
  .chat-top s{display:block;text-decoration:none;font-size:12.5px;color:var(--live);font-weight:600}
  .chat-body{padding:20px;display:flex;flex-direction:column;gap:12px;min-height:290px;
    max-height:390px;overflow-y:auto;scroll-behavior:smooth}
  .cm{max-width:84%;padding:13px 17px;border-radius:19px;font-size:16.5px;line-height:1.52;
    animation:pop .45s var(--ease) both}
  .cm.d{background:var(--ink);color:#F7F2E5;border-bottom-left-radius:6px;align-self:flex-start}
  .cm.d strong{color:var(--amber)}
  .cm.u{background:var(--cream-2);color:var(--ink-2);border:1px solid var(--rule);
    border-bottom-right-radius:6px;align-self:flex-end;font-style:italic}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .typing{display:inline-flex;gap:5px;align-items:center}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--amber);display:block;
    animation:bob 1.35s ease-in-out infinite}
  .typing span:nth-child(2){animation-delay:.18s}.typing span:nth-child(3){animation-delay:.36s}
  @keyframes bob{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
  .cm.typ{background:var(--cream-2);align-self:flex-start;padding:14px 18px}
  .chips{display:flex;flex-wrap:wrap;gap:9px;padding:0 20px 20px}
  .chip{background:transparent;border:1.5px solid var(--amber);color:var(--amber-d);
    font-family:Karla,sans-serif;font-weight:600;font-size:15px;padding:9px 16px;border-radius:999px;
    cursor:pointer;transition:all .22s var(--ease)}
  .chip:hover{background:var(--amber);color:#20160A;transform:translateY(-2px)}
  .chat-foot{padding:16px 20px;border-top:1px solid var(--rule);background:var(--cream-2);
    font-size:14px;color:var(--ink-3);display:flex;align-items:center;gap:9px;justify-content:space-between;flex-wrap:wrap}

  section{padding:clamp(64px,8.5vw,118px) 0;position:relative}
  .kick{font-size:12.5px;letter-spacing:.19em;text-transform:uppercase;font-weight:700;
    color:var(--amber-d);margin-bottom:15px}
  .h2{font-size:clamp(29px,5vw,54px)}
  .sub{color:var(--ink-2);font-size:19.5px;max-width:56ch;margin:20px 0 0}

  /* ── 27 tabs scroll moment ────────────────────── */
  .tabs-sec{background:var(--cream-2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
    text-align:center;overflow:hidden}
  .tabstrip{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:0 auto 34px;max-width:820px}
  .tb{font-size:13px;background:var(--paper);border:1px solid var(--rule);color:var(--ink-3);
    padding:8px 15px;border-radius:9px 9px 3px 3px;white-space:nowrap;
    transition:opacity .5s var(--ease),transform .5s var(--ease),filter .5s var(--ease)}
  .tabs-sec.go .tb{opacity:0;transform:translateY(-14px) scale(.9);filter:blur(2px)}
  .tb.keep{background:var(--amber)!important;color:#20160A!important;border-color:var(--amber)!important;
    font-weight:700;font-size:14.5px;padding:10px 20px}
  .tabs-sec.go .tb.keep{opacity:1;transform:translateY(0) scale(1.06);filter:none;
    box-shadow:0 12px 26px -12px rgba(201,124,12,.8)}
  .tabs-sec h2{font-size:clamp(27px,4.5vw,48px);max-width:20ch;margin:0 auto}
  .tabs-sec p{color:var(--ink-2);font-size:19px;max-width:48ch;margin:20px auto 0}

  /* ── conversation thread ──────────────────────── */
  .thread{margin-top:44px;display:flex;flex-direction:column;gap:24px}
  .msg{max-width:min(560px,90%)}
  .msg.them{align-self:flex-end}
  .msg.her{align-self:flex-start}
  .bubble{padding:17px 22px;border-radius:22px;font-size:17.5px;line-height:1.58;box-shadow:var(--sh1)}
  .them .bubble{background:var(--paper);border:1px solid var(--rule);border-bottom-right-radius:7px;
    color:var(--ink-2);font-style:italic}
  .her .bubble{background:var(--ink);color:#F7F2E5;border-bottom-left-radius:7px}
  .her .bubble strong{color:var(--amber)}
  .lbl{font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:7px;display:flex;align-items:center;gap:8px}
  .her .lbl{color:var(--amber-d)}
  .her .lbl .av{width:19px;height:19px;border-radius:50%;background:var(--amber);flex:none}
  .reveal{animation:rise .75s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  /* ── bring anything ───────────────────────────── */
  .bring{display:grid;gap:clamp(20px,2.6vw,30px);margin-top:50px}
  @media(min-width:820px){.bring{grid-template-columns:repeat(3,1fr)}}
  .br{position:relative;border-radius:24px;overflow:hidden;box-shadow:var(--sh2);min-height:350px;
    display:flex;align-items:flex-end;transition:transform .45s var(--ease),box-shadow .45s var(--ease)}
  .br:hover{transform:translateY(-8px);box-shadow:var(--sh3)}
  .br img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;
    transition:transform .8s var(--ease)}
  .br:hover img{transform:scale(1.07)}
  .br::after{content:"";position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(18,14,7,.03) 28%,rgba(18,14,7,.88) 100%)}
  .br .txt{position:relative;z-index:2;padding:26px;color:#FBF7EE}
  .br h3{font-size:23px;margin-bottom:8px}
  .br p{margin:0;font-size:16px;color:#E6DECD}

  /* ── trust ────────────────────────────────────── */
  .trust{background:var(--paper);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .tgrid{display:grid;gap:clamp(24px,3.4vw,42px);margin-top:44px}
  @media(min-width:760px){.tgrid{grid-template-columns:repeat(2,1fr)}}
  .t{display:flex;gap:16px;align-items:flex-start}
  .t .ic{width:44px;height:44px;border-radius:14px;background:var(--amber-t);flex:none;
    display:grid;place-items:center;font-size:20px}
  .t h3{font-size:19.5px;margin-bottom:5px}
  .t p{margin:0;color:var(--ink-2);font-size:16.5px}

  /* ── her ──────────────────────────────────────── */
  .her-sec{background:var(--ink);color:#F7F2E5;overflow:hidden}
  .her-sec .kick{color:var(--amber)}
  .her-in{display:grid;gap:clamp(30px,4.6vw,58px);align-items:center}
  @media(min-width:880px){.her-in{grid-template-columns:.82fr 1.18fr}}
  .her-ph{border-radius:26px;overflow:hidden;box-shadow:var(--sh3);transform:rotate(1.6deg)}
  .her-ph img{width:100%;aspect-ratio:4/4.7;object-fit:cover}
  .her-sec h2{color:#F7F2E5}
  .her-sec p{color:#C5BEAD;font-size:19.5px;max-width:56ch}
  .her-sec p.hi{color:#F7F2E5}
  .yrs{display:flex;align-items:baseline;gap:16px;margin:28px 0 8px}
  .yrs b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(54px,8vw,86px);
    line-height:.84;color:var(--amber);letter-spacing:-.045em}
  .yrs span{font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    color:#918A79;max-width:14ch;line-height:1.45}

  /* ── portal ───────────────────────────────────── */
  .portal{background:linear-gradient(180deg,var(--cream) 0%,var(--amber-t) 100%)}
  .plans{display:grid;gap:20px;margin-top:46px}
  @media(min-width:900px){.plans{grid-template-columns:repeat(3,1fr)}}
  .plan{background:var(--paper);border:1.5px solid var(--rule);border-radius:24px;padding:30px 28px;
    display:flex;flex-direction:column;box-shadow:var(--sh1);
    transition:transform .4s var(--ease),box-shadow .4s var(--ease),border-color .3s}
  .plan:hover{transform:translateY(-7px);box-shadow:var(--sh2);border-color:var(--amber)}
  .plan.feat{border-color:var(--amber);border-width:2px;box-shadow:var(--sh2)}
  .plan .tag{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--amber-d);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .plan h3{font-size:24px;margin-bottom:8px}
  .plan .price{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:40px;
    letter-spacing:-.035em;margin:14px 0 4px;line-height:1}
  .plan .price small{font-size:15px;font-weight:600;color:var(--ink-3);letter-spacing:0}
  .plan p.d{color:var(--ink-2);font-size:16.5px;margin:8px 0 0}
  .plan ul{list-style:none;padding:0;margin:20px 0 26px}
  .plan li{padding-left:25px;position:relative;margin-bottom:9px;font-size:16px;color:var(--ink-2)}
  .plan li::before{content:"✓";position:absolute;left:0;color:var(--amber-d);font-weight:700}
  .plan .btn{margin-top:auto;text-align:center}
  .howflow{margin-top:50px;background:var(--paper);border:1px solid var(--rule);border-radius:24px;
    padding:clamp(26px,3.4vw,42px);box-shadow:var(--sh1)}
  .fl{display:grid;gap:22px;margin-top:26px}
  @media(min-width:780px){.fl{grid-template-columns:repeat(4,1fr)}}
  .fl div{position:relative;padding-top:36px}
  .fl div::before{content:attr(data-n);position:absolute;top:0;left:0;width:27px;height:27px;
    border-radius:50%;background:var(--amber);color:#241706;font-weight:700;font-size:13.5px;
    display:grid;place-items:center}
  .fl h4{margin:0 0 5px;font-size:17px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700}
  .fl p{margin:0;font-size:15.5px;color:var(--ink-2)}
  .lineinfo{margin-top:26px;display:flex;gap:14px;align-items:flex-start;background:var(--amber-t);
    border-radius:16px;padding:20px 22px}
  .lineinfo .ic{font-size:22px;flex:none}
  .lineinfo p{margin:0;font-size:16.5px;color:var(--ink-2)}
  .lineinfo strong{color:var(--ink)}

  .close{text-align:center;background:var(--ink);color:#F7F2E5;overflow:hidden;position:relative}
  .close::before{content:"";position:absolute;top:-180px;left:50%;transform:translateX(-50%);
    width:960px;height:560px;background:radial-gradient(circle,rgba(245,166,35,.22) 0%,transparent 66%)}
  .close h2{font-size:clamp(38px,7.4vw,82px);color:#F7F2E5;position:relative}
  .close p{color:#C5BEAD;font-size:20px;max-width:42ch;margin:22px auto 0;position:relative}
  footer{background:var(--ink);color:#918A79;padding:0 0 58px;font-size:15px}
  .foot{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;
    border-top:1px solid #2B2718;padding-top:30px}
  .foot .logo b{color:#F7F2E5}
  a:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}.tabs-sec.go .tb{opacity:1;transform:none;filter:none}}

  /* ── scroll progress ──────────────────────────── */
  .prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--amber);z-index:60;
    transition:width .12s linear}
  /* ── hero pointer glow ────────────────────────── */
  .spot{position:absolute;width:520px;height:520px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(245,166,35,.16) 0%,transparent 65%);
    transform:translate(-50%,-50%);opacity:0;transition:opacity .5s ease;z-index:0}
  .hero:hover .spot{opacity:1}
  .hero-in{z-index:1}
  /* ── how I work (replaces emoji grid) ─────────── */
  .rules{margin-top:48px;border-left:2px solid var(--rule);padding-left:0}
  .rule{position:relative;padding:0 0 34px 34px}
  .rule:last-child{padding-bottom:0}
  .rule::before{content:"";position:absolute;left:-7px;top:9px;width:12px;height:12px;
    border-radius:50%;background:var(--amber);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--rule)}
  .rule h3{font-size:21px;margin-bottom:6px}
  .rule p{margin:0;color:var(--ink-2);font-size:17px;max-width:54ch}
  .rule .no{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:var(--amber-d);display:block;margin-bottom:5px}
  /* ── moments ──────────────────────────────────── */
  .moments{background:var(--cream-2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .mlist{margin-top:44px;display:grid;gap:2px;border-radius:20px;overflow:hidden;
    border:1px solid var(--rule)}
  .m{background:var(--paper);padding:24px clamp(20px,3vw,32px);display:flex;gap:18px;
    align-items:baseline;transition:background .3s var(--ease),padding-left .3s var(--ease)}
  .m:hover{background:var(--amber-t);padding-left:calc(clamp(20px,3vw,32px) + 8px)}
  .m .tm{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:13px;
    letter-spacing:.11em;text-transform:uppercase;color:var(--amber-d);flex:none;width:88px}
  .m p{margin:0;font-size:18.5px;color:var(--ink);line-height:1.5}
  @media(max-width:600px){.m{flex-direction:column;gap:6px}.m .tm{width:auto}}
  /* ── faq ──────────────────────────────────────── */
  .faq{margin-top:42px;display:grid;gap:12px}
  .fq{background:var(--paper);border:1px solid var(--rule);border-radius:18px;
    padding:20px 24px;transition:border-color .3s,box-shadow .3s}
  .fq[open]{border-color:var(--amber);box-shadow:var(--sh1)}
  .fq summary{cursor:pointer;list-style:none;font-family:"Bricolage Grotesque",sans-serif;
    font-weight:700;font-size:18px;display:flex;justify-content:space-between;gap:16px;align-items:center}
  .fq summary::-webkit-details-marker{display:none}
  .fq summary::after{content:"";width:11px;height:11px;border-right:2.5px solid var(--amber);
    border-bottom:2.5px solid var(--amber);transform:rotate(45deg);flex:none;transition:transform .3s var(--ease)}
  .fq[open] summary::after{transform:rotate(-135deg)}
  .fq p{margin:14px 0 0;color:var(--ink-2);font-size:17px}
  /* ── sticky mobile cta ────────────────────────── */
  .mcta{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--cream) 94%,transparent);backdrop-filter:blur(14px);
    border-top:1px solid var(--rule);display:none;gap:10px;align-items:center;justify-content:space-between}
  .mcta span{font-size:14px;font-weight:600;color:var(--ink-2)}
  @media(max-width:780px){.mcta{display:flex}body{padding-bottom:74px}}

  /* ── one room, three modes ────────────────────── */
  .roomwrap{margin-top:46px;display:grid;gap:clamp(28px,4vw,52px);align-items:center}
  @media(min-width:940px){.roomwrap{grid-template-columns:1.05fr .95fr}}
  .room{background:var(--paper);border:1px solid var(--rule);border-radius:26px;overflow:hidden;
    box-shadow:var(--sh3)}
  .room-top{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;border-bottom:1px solid var(--rule);
    background:color-mix(in srgb,var(--amber-t) 55%,var(--paper))}
  .room-top .ttl{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700}
  .room-top .lock{font-size:12px;color:var(--ink-3);font-weight:600}
  .modes{display:flex;gap:6px;padding:14px 18px 0}
  .mode{flex:1;background:transparent;border:1.5px solid var(--rule);color:var(--ink-2);
    font-family:Karla,sans-serif;font-weight:700;font-size:14.5px;padding:10px 8px;border-radius:12px;
    cursor:pointer;transition:all .25s var(--ease)}
  .mode:hover{border-color:var(--amber)}
  .mode[aria-selected="true"]{background:var(--amber);border-color:var(--amber);color:#20160A}
  .room-body{padding:18px;min-height:262px}
  .pane{display:none;animation:pop .4s var(--ease) both}
  .pane.on{display:block}
  /* chat pane */
  .rc{display:flex;flex-direction:column;gap:10px}
  .rb{max-width:82%;padding:11px 15px;border-radius:17px;font-size:15.5px;line-height:1.5}
  .rb.d{background:var(--ink);color:#F7F2E5;align-self:flex-start;border-bottom-left-radius:5px}
  .rb.u{background:var(--cream-2);border:1px solid var(--rule);color:var(--ink-2);
    align-self:flex-end;border-bottom-right-radius:5px;font-style:italic}
  .rin{margin-top:14px;display:flex;gap:8px;align-items:center;border:1.5px solid var(--rule);
    border-radius:999px;padding:9px 9px 9px 16px;color:var(--ink-3);font-size:15px}
  .rin b{margin-left:auto;background:var(--amber);color:#20160A;border-radius:999px;
    padding:7px 15px;font-size:13.5px}
  /* voice pane */
  .voice{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:22px 0}
  .vav{width:88px;height:88px;border-radius:50%;overflow:hidden;box-shadow:var(--sh2);
    outline:3px solid var(--amber);outline-offset:4px}
  .vav img{width:100%;height:100%;object-fit:cover;object-position:60% 30%}
  .vname{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px}
  .waves{display:flex;gap:4px;align-items:flex-end;height:34px}
  .waves i{width:5px;background:var(--amber);border-radius:3px;display:block;height:9px;
    animation:wv 1.1s ease-in-out infinite}
  .waves i:nth-child(2){animation-delay:.1s}.waves i:nth-child(3){animation-delay:.2s}
  .waves i:nth-child(4){animation-delay:.3s}.waves i:nth-child(5){animation-delay:.4s}
  .waves i:nth-child(6){animation-delay:.5s}.waves i:nth-child(7){animation-delay:.6s}
  @keyframes wv{0%,100%{height:9px}50%{height:30px}}
  .vctrl{display:flex;gap:10px;margin-top:4px}
  .vc{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule);background:var(--paper);
    display:grid;place-items:center;font-size:17px}
  .vc.end{background:#D14343;border-color:#D14343}
  /* video pane */
  .vtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .vt{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:var(--cream-2);
    border:1px solid var(--rule)}
  .vt img{width:100%;height:100%;object-fit:cover}
  .vt .nm{position:absolute;left:9px;bottom:9px;background:rgba(18,14,7,.72);color:#fff;
    font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px}
  .vt.off{display:grid;place-items:center;color:var(--ink-3);font-size:14px;text-align:center;padding:12px}
  .room-foot{padding:13px 18px;border-top:1px solid var(--rule);background:var(--cream-2);
    font-size:13.5px;color:var(--ink-3);text-align:center}
  .oneline{display:flex;gap:14px;align-items:flex-start;background:var(--ink);color:#F7F2E5;
    border-radius:20px;padding:24px 26px;margin-top:22px}
  .oneline .ic{font-size:22px;flex:none}
  .oneline h4{margin:0 0 6px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px}
  .oneline p{margin:0;font-size:16px;color:#C5BEAD}
  .oneline strong{color:var(--amber)}

  /* ── polish ───────────────────────────────────── */
  ::selection{background:var(--amber);color:#20160A}
  .chat-body::-webkit-scrollbar{width:7px}
  .chat-body::-webkit-scrollbar-thumb{background:var(--rule);border-radius:99px}
  .chat-body::-webkit-scrollbar-thumb:hover{background:var(--amber)}
  .chat-body{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
  /* hero entrance */
  .hero .eyeb,.hero h1,.hero .lede,.hero .hcta,.hero .hnote{animation:up .85s var(--ease) both}
  .hero h1{animation-delay:.06s}.hero .lede{animation-delay:.13s}
  .hero .hcta{animation-delay:.2s}.hero .hnote{animation-delay:.26s}
  .chat{animation:up .95s var(--ease) .14s both}
  @keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  /* ── pull quote ───────────────────────────────── */
  .pq{background:var(--ink);color:#F7F2E5;text-align:center;position:relative;overflow:hidden}
  .pq::before{content:"";position:absolute;top:-40%;left:50%;transform:translateX(-50%);
    width:900px;height:600px;background:radial-gradient(circle,rgba(245,166,35,.17) 0%,transparent 66%)}
  .pq .mk{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(60px,9vw,110px);
    line-height:.5;color:var(--amber);display:block;margin-bottom:6px;position:relative}
  .pq blockquote{margin:0;position:relative;font-family:"Bricolage Grotesque",sans-serif;
    font-weight:700;font-size:clamp(25px,4.3vw,46px);line-height:1.16;letter-spacing:-.03em;
    max-width:20ch;margin-inline:auto;text-wrap:balance}
  .pq cite{display:block;margin-top:26px;font-style:normal;font-size:14px;letter-spacing:.16em;
    text-transform:uppercase;font-weight:700;color:#918A79;position:relative}
  /* ── soft path ────────────────────────────────── */
  .soft{margin-top:clamp(40px,5vw,64px);background:var(--paper);border:1.5px dashed var(--rule);
    border-radius:22px;padding:clamp(26px,3.4vw,38px);display:flex;gap:20px;align-items:center;
    flex-wrap:wrap;justify-content:space-between}
  .soft h3{font-size:22px;margin-bottom:6px}
  .soft p{margin:0;color:var(--ink-2);font-size:16.5px;max-width:52ch}
</style>
